name: Linux Arch package

on:
  pull_request:
    paths:
      - 'Linux/**'
      - '.github/workflows/linux-arch-package.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    paths:
      - 'Linux/**'
      - '.github/workflows/linux-arch-package.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-arch-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Update build image
        run: |
          printf '%s\n' \
            'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' \
            > /etc/pacman.d/mirrorlist
          for attempt in 1 2 3; do
            if pacman -Syyu --noconfirm git sudo python; then
              exit 0
            fi
            sleep "$((attempt * 10))"
          done
          exit 1

      - uses: actions/checkout@v4
        with:
          # Lifecycle validation builds the last production package from its
          # immutable repository commit before upgrading it to this checkout.
          fetch-depth: 0

      - name: Configure unprivileged package builder
        run: |
          useradd --create-home builder
          printf 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Verify AUR metadata
        run: |
          package_dir="$GITHUB_WORKSPACE/Linux/packaging/arch"
          su builder --shell /bin/bash --command \
            "cd '$package_dir' && makepkg --printsrcinfo" > /tmp/yap.SRCINFO
          diff -u "$package_dir/.SRCINFO" /tmp/yap.SRCINFO

      - name: Build 0.0.11 production predecessor
        run: |
          legacy_root="$RUNNER_TEMP/yap-0.0.11"
          install -d "$legacy_root"
          su builder --shell /bin/bash --command \
            "git -C '$GITHUB_WORKSPACE' archive b334a67af83ca07798856563b4c79a1a2ed6da37 Linux/packaging/arch" \
            | tar -x -C "$legacy_root"
          legacy_package_dir="$legacy_root/Linux/packaging/arch"
          chown -R builder:builder "$legacy_root"
          su builder --shell /bin/bash --command \
            "cd '$legacy_package_dir' && makepkg --syncdeps --noconfirm --cleanbuild --clean --force --nocheck"

      - name: Build and test package
        run: |
          package_dir="$GITHUB_WORKSPACE/Linux/packaging/arch"
          su builder --shell /bin/bash --command \
            "cd '$package_dir' && makepkg --syncdeps --noconfirm --cleanbuild --clean --force"

      - name: Verify upgrade, uninstall, reinstall, and CPU base package
        run: |
          set -euo pipefail
          legacy_packages=(
            "$RUNNER_TEMP"/yap-0.0.11/Linux/packaging/arch/yap-dictation-0.0.11-*.pkg.tar.zst
          )
          current_packages=(
            "$GITHUB_WORKSPACE"/Linux/packaging/arch/yap-dictation-*.pkg.tar.zst
          )
          if [[ ${#legacy_packages[@]} -ne 1 || ! -f "${legacy_packages[0]}" ]]; then
            printf 'expected one 0.0.11 package, found: %s\n' "${legacy_packages[*]}"
            exit 1
          fi
          if [[ ${#current_packages[@]} -ne 1 || ! -f "${current_packages[0]}" ]]; then
            printf 'expected one current package, found: %s\n' "${current_packages[*]}"
            exit 1
          fi
          if pacman -Q ggml-cuda >/dev/null 2>&1; then
            echo 'ggml-cuda must remain optional'
            exit 1
          fi

          # The official Arch container excludes /usr/share/doc to stay small.
          # Lifecycle validation needs a normal extraction policy so package
          # integrity includes Yap's installed README.
          lifecycle_pacman_conf="$RUNNER_TEMP/pacman-lifecycle.conf"
          cp /etc/pacman.conf "$lifecycle_pacman_conf"
          sed -i '/^NoExtract.*usr\/share\/doc/s/^/# lifecycle test: /' \
            "$lifecycle_pacman_conf"
          ! grep -E '^NoExtract.*usr/share/doc' "$lifecycle_pacman_conf"

          pacman --config "$lifecycle_pacman_conf" -U --noconfirm "${legacy_packages[0]}"
          test "$(yap --version)" = 'yap 0.0.11'

          state_dir=/home/builder/.local/share/yap
          state_file="$state_dir/state.json"
          install -d -m 0700 -o builder -g builder "$state_dir"
          printf '%s\n' \
            '{"version":1,"settings":{"cleanup_intensity":"high","audio_mode":"lower","duck_level":0.25,"trim_courtesy":false},"snippets":[{"id":7,"trigger":"release proof","expansion":"state survived"}],"history":[{"id":8,"text":"private lifecycle fixture","app_name":"CI","created_unix_ms":1}],"next_id":9}' \
            > "$state_file"
          chown builder:builder "$state_file"
          chmod 0600 "$state_file"
          su builder --shell /bin/bash --command \
            "python -m json.tool '$state_file' >/dev/null"
          state_sha256="$(sha256sum "$state_file" | cut -d ' ' -f 1)"

          upgrade_log="$RUNNER_TEMP/yap-upgrade.log"
          pacman --config "$lifecycle_pacman_conf" -U --noconfirm \
            "${current_packages[0]}" | tee "$upgrade_log"
          grep -F 'Yap was upgraded.' "$upgrade_log"
          expected_version="$(sed -n 's/^[[:space:]]*pkgver = //p' \
            "$GITHUB_WORKSPACE/Linux/packaging/arch/.SRCINFO" | head -n 1)"
          test "$(yap --version)" = "yap $expected_version"
          test "$(yapctl --version)" = "yapctl $expected_version"
          test -x /usr/bin/yapd
          test -x /usr/bin/yap-overlay
          test -x /usr/bin/yap-ui
          test -x /usr/bin/yap-tray
          test -f /usr/lib/systemd/user/yap.service
          test -f /usr/lib/systemd/user/yap-overlay.service
          test -f /usr/lib/systemd/user/yap-tray.service
          test -f /usr/share/dbus-1/services/com.yap.Yap.service
          test -f /usr/share/applications/com.yap.Yap.Dashboard.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/com.yap.Yap.svg
          test -f /usr/share/doc/yap-dictation/README.md
          test "$(sha256sum "$state_file" | cut -d ' ' -f 1)" = "$state_sha256"
          pacman --config "$lifecycle_pacman_conf" -Qkk yap-dictation

          pacman --config "$lifecycle_pacman_conf" -R --noconfirm yap-dictation
          ! pacman -Q yap-dictation
          test ! -e /usr/bin/yap
          test ! -e /usr/bin/yapctl
          test ! -e /usr/bin/yapd
          test ! -e /usr/lib/systemd/user/yap.service
          test ! -e /usr/share/applications/com.yap.Yap.Dashboard.desktop
          test ! -e /usr/share/doc/yap-dictation/README.md
          test "$(sha256sum "$state_file" | cut -d ' ' -f 1)" = "$state_sha256"

          pacman --config "$lifecycle_pacman_conf" -U --noconfirm \
            "${current_packages[0]}"
          test "$(yap --version)" = "yap $expected_version"
          test -f /usr/share/doc/yap-dictation/README.md
          test "$(sha256sum "$state_file" | cut -d ' ' -f 1)" = "$state_sha256"
          pacman --config "$lifecycle_pacman_conf" -Qkk yap-dictation

      - name: Verify current Linux source
        run: |
          grep -Fx "options=('!debug')" Linux/packaging/arch/PKGBUILD.dev
          cargo test --locked --manifest-path Linux/Cargo.toml --workspace
          python Linux/ui/yap-overlay --self-test
          python Linux/ui/yap-ui --self-test
          python Linux/ui/yap-tray --self-test
          bash -n Prototypes/LinuxHyprlandSpike/run.sh

[workspace]
resolver = "3"
members = ["crates/yap-cli", "crates/yap-core", "crates/yap-daemon"]

[workspace.package]
version = "0.0.11"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kylescudder/yap"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
zbus = { version = "5.9", default-features = false, features = ["tokio"] }
